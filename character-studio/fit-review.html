<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Studio · Fit review</title><style>body{font:14px system-ui;background:#fafbf7;color:#263c37;margin:24px}h1{font-size:22px}a{color:inherit}section{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-bottom:1px solid #ddd;padding-bottom:20px}figure{margin:0;background:#f2eee4;border-radius:12px;overflow:hidden}canvas{width:100%;display:block}figcaption{padding:10px;text-align:center}h2{font-size:15px;margin-top:30px}</style><a href="./">← Character Studio</a><h1>Accessory fit review</h1><p>Default fit on every character. Original artwork and the same placement rules as the studio.</p><main id="grid"></main><script src="model.js"></script><script>
(async()=>{const m=await(await fetch('assets/manifest.json')).json(),assets=new Map();await Promise.all([...m.characters,...m.accessories].map(async a=>{const image=new Image();image.src=a.src;await image.decode();const c=document.createElement('canvas');c.width=image.width;c.height=image.height;const ctx=c.getContext('2d');ctx.drawImage(image,0,0);const pixels=ctx.getImageData(0,0,c.width,c.height).data;let x=c.width,y=c.height,r=0,b=0;for(let j=0;j<c.height;j++)for(let i=0;i<c.width;i++)if(pixels[(j*c.width+i)*4+3]>100){x=Math.min(x,i);y=Math.min(y,j);r=Math.max(r,i);b=Math.max(b,j);}assets.set(a.id,{image,bounds:{x,y,w:r-x+1,h:b-y+1}});}));for(const a of m.accessories){const title=document.createElement('h2');title.id=a.id;title.textContent=a.name;const row=document.createElement('section');for(const ch of m.characters){const f=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption');c.width=c.height=1024;const ctx=c.getContext('2d');ctx.drawImage(assets.get(ch.id).image,90,140,844,844);const loaded=assets.get(a.id),b=loaded.bounds,p=StudioModel.placement(ch,a,StudioModel.newLayer(a.id),b);ctx.drawImage(loaded.image,b.x,b.y,b.w,b.h,p.x-p.width/2,p.y-p.height*p.pivot,p.width,p.height);caption.textContent=ch.name+' · '+a.name;f.append(c,caption);row.append(f);}document.querySelector('main').append(title,row);}document.title='Ready · Accessory fit review';})();
</script></html>
