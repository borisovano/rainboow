<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מילה בקול · מצילים חבר</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="style.css">
<main>
<h1>קוראים את המילה בקול</h1>
<section class="card" aria-label="תרגול קריאה">
<div class="prompt"><div class="meta" id="meta"></div><div class="word" id="word"></div><div class="letters" id="letters" aria-label="אותיות המילה"></div><div class="letter-tip">לחצו על אות כדי לשמוע אותה 🔊</div></div>
<div class="response">
<button class="mic" id="mic"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0014 0v-2M12 19v3M8 22h8"/></svg><span id="mic-label">לוחצים ואומרים</span></button>
<div class="help-controls"><button id="hint-button">💡 רמז</button><button id="sound-button" aria-pressed="true" aria-label="צלילים פעילים">🔊 צלילים</button></div>
<div id="hint" class="hint" hidden aria-live="polite"></div>
<div id="status" class="status" role="status" aria-live="polite"></div>
</div>
</section>
<div id="adult-fallback"><label><input id="adult-confirm" type="checkbox"> מבוגר שמע אותי קורא/ת נכון</label><button id="adult-submit">אישור מבוגר</button></div>
<small>לא נשמרות הקלטות. זיהוי קולי עשוי להשתמש בשירות מקוון ולטעות.</small>
</main><div id="celebration" class="celebration" aria-hidden="true"></div><script src="../helpers/client.js"></script><script src="words.js"></script><script src="logic.js"></script><script src="app.js"></script>
</html>
